name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend — unit + integration
    runs-on: ubuntu-latest

    # Real Postgres + Redis so the integration tests (seat-hold race,
    # phantom-hold regression) exercise the actual concurrency primitives.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: booking
          POSTGRES_PASSWORD: booking_pass
          POSTGRES_DB: booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U booking -d booking"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      NODE_ENV: test
      RUN_INTEGRATION: '1'
      PG_PRIMARY_HOST: localhost
      PG_PRIMARY_PORT: '5432'
      # Only one Postgres in CI — point the replica reads at the same instance.
      PG_REPLICA_HOST: localhost
      PG_REPLICA_PORT: '5432'
      PG_USER: booking
      PG_PASSWORD: booking_pass
      PG_DATABASE: booking
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci_non_default_secret

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Run migrations
        run: node src/scripts/migrate.js
      - name: Run tests (unit + integration)
        run: npm test

  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

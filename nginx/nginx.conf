# ─────────────────────────────────────────────────────────────────────────────
#  nginx load balancer for the booking system
#   - /api  → least_conn across both node instances (stateless REST)
#   - /ws   → ip_hash (sticky) for Socket.io WebSocket connections
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Real client IP / forwarding chain
    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time ups=$upstream_addr';
    access_log /var/log/nginx/access.log main;

    # REST API: distribute by least active connections
    upstream api_backend {
        least_conn;
        server node_app_1:3000 max_fails=3 fail_timeout=15s;
        server node_app_2:3001 max_fails=3 fail_timeout=15s;
    }

    # WebSockets: sticky by client IP so a socket stays on one node
    upstream ws_backend {
        ip_hash;
        server node_app_1:3000 max_fails=3 fail_timeout=15s;
        server node_app_2:3001 max_fails=3 fail_timeout=15s;
    }

    # Map for the Connection header on WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # ─── REST API ───
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    60s;
        }

        # ─── WebSocket (Socket.io is configured with path: /ws) ───
        location /ws/ {
            proxy_pass http://ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;   # keep long-lived sockets open
            proxy_send_timeout 86400s;
        }

        # ─── Health (proxied to an app instance) ───
        location = /health {
            proxy_pass http://api_backend/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
}

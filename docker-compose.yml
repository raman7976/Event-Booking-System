name: booking-system

# ─────────────────────────────────────────────────────────────────────────────
#  Real-Time Event Seat Booking System
#  nginx ─▶ node_app_1 / node_app_2  (Express + Socket.io)
#         ├─▶ redis            (pub/sub + cache + queues)
#         ├─▶ postgres_primary (writes)  ──streaming replication──▶ postgres_replica (reads)
#         └─▶ bullmq_worker    (expiry / email / waitlist jobs)
# ─────────────────────────────────────────────────────────────────────────────

x-app-env: &app-env
  NODE_ENV: production
  CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
  JWT_SECRET: ${JWT_SECRET:-dev_super_secret_change_me_in_production}
  ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
  REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  # Writes go through PgBouncer (transaction pooling): N app instances × pool
  # no longer multiply into N×pool real PG connections on the primary.
  PG_PRIMARY_HOST: ${PG_PRIMARY_HOST_OVERRIDE:-pgbouncer}
  PG_PRIMARY_PORT: ${PG_PRIMARY_PORT_OVERRIDE:-6432}
  PG_REPLICA_HOST: postgres_replica
  PG_REPLICA_PORT: 5432
  PG_DATABASE: ${PG_DATABASE:-booking}
  PG_USER: ${PG_USER:-booking}
  PG_PASSWORD: ${PG_PASSWORD:-booking_pass}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_URL: redis://redis:6379
  HOLD_TTL_SECONDS: ${HOLD_TTL_SECONDS:-480}
  RATE_LIMIT_HOLDS: ${RATE_LIMIT_HOLDS:-3}
  RATE_LIMIT_WINDOW_SECONDS: ${RATE_LIMIT_WINDOW_SECONDS:-60}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
  BUS_OPEN_SECONDS: ${BUS_OPEN_SECONDS:-3600}
  BUS_CONFIRM_SECONDS: ${BUS_CONFIRM_SECONDS:-1200}
  BUS_AUTORELEASE_SECONDS: ${BUS_AUTORELEASE_SECONDS:-600}
  BUS_DEFAULT_CAPACITY: ${BUS_DEFAULT_CAPACITY:-40}
  BUS_EMAIL_DOMAIN: ${BUS_EMAIL_DOMAIN:-lnmiit.ac.in}
  TZ: ${TZ:-Asia/Kolkata}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-Event Booking <no-reply@booking.local>}

services:
  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - booking_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── PostgreSQL 15 — PRIMARY (writes) ─────────────────────────────────────
  postgres_primary:
    image: postgres:15
    command:
      - "postgres"
      - "-c"
      - "wal_level=replica"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "hot_standby=on"
      - "-c"
      - "listen_addresses=*"
    environment:
      POSTGRES_USER: ${PG_USER:-booking}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-booking_pass}
      POSTGRES_DB: ${PG_DATABASE:-booking}
      PG_REPLICATION_USER: ${PG_REPLICATION_USER:-replicator}
      PG_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:-replicator_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
      - ./docker/primary-init.sh:/docker-entrypoint-initdb.d/00-replication.sh:ro
    networks:
      - booking_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ─── PgBouncer — connection pooler in front of the PRIMARY (writes) ───────
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    depends_on:
      postgres_primary:
        condition: service_healthy
    environment:
      DATABASES_HOST: postgres_primary
      DATABASES_PORT: "5432"
      DATABASES_USER: ${PG_USER:-booking}
      DATABASES_PASSWORD: ${PG_PASSWORD:-booking_pass}
      DATABASES_DBNAME: ${PG_DATABASE:-booking}
      PGBOUNCER_LISTEN_PORT: "6432"
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: "200"
      PGBOUNCER_DEFAULT_POOL_SIZE: "20"
      PGBOUNCER_AUTH_TYPE: scram-sha-256
      PGBOUNCER_AUTH_FILE: /etc/pgbouncer/userlist.txt
    volumes:
      # plaintext secrets are valid for scram auth_type; edit alongside PG_PASSWORD
      - ./docker/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - booking_net
    healthcheck:
      # image ships no psql — TCP-open check; the app /health probes the full
      # SELECT-1 path through pgbouncer anyway.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6432 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ─── PostgreSQL 15 — REPLICA (reads, streaming replication) ───────────────
  postgres_replica:
    image: postgres:15
    depends_on:
      postgres_primary:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${PG_USER:-booking}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-booking_pass}
      POSTGRES_DB: ${PG_DATABASE:-booking}
      PG_REPLICATION_USER: ${PG_REPLICATION_USER:-replicator}
      PG_REPLICATION_PASSWORD: ${PG_REPLICATION_PASSWORD:-replicator_pass}
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5433:5432"
    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - ./docker/replica-entrypoint.sh:/usr/local/bin/replica-entrypoint.sh:ro
    networks:
      - booking_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ─── Node app instance #1 (Express + Socket.io) ──────────────────────────
  node_app_1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      PORT: 3000
      INSTANCE_ID: node_app_1
    depends_on:
      redis:
        condition: service_healthy
      postgres_primary:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - booking_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Node app instance #2 ─────────────────────────────────────────────────
  node_app_2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      <<: *app-env
      PORT: 3001
      INSTANCE_ID: node_app_2
    depends_on:
      redis:
        condition: service_healthy
      postgres_primary:
        condition: service_healthy
      postgres_replica:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - booking_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── BullMQ worker (expiry / email / waitlist) — separate process ─────────
  bullmq_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["node", "src/workers/index.js"]
    environment:
      <<: *app-env
      INSTANCE_ID: bullmq_worker
      WORKER_HEALTH_PORT: 3002
    depends_on:
      redis:
        condition: service_healthy
      postgres_primary:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    networks:
      - booking_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── nginx load balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      node_app_1:
        condition: service_started
      node_app_2:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - booking_net
    restart: unless-stopped
    healthcheck:
      # localhost resolves to ::1 in the container, but nginx listens on IPv4 only
      # -> use 127.0.0.1 explicitly.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Monitoring (opt-in): docker compose --profile monitoring up -d ───────
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - booking_net

  grafana:
    image: grafana/grafana:latest
    profiles: ["monitoring"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3005:3000"
    networks:
      - booking_net

networks:
  booking_net:
    driver: bridge

volumes:
  redis_data:
  postgres_primary_data:
  postgres_replica_data:
